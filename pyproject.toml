[project]
name = "searay-sales-intelligence"
version = "0.1.0"
description = "Searay Sales Intelligence POC — RFM + upsell reports and a rep-facing rule-based learning loop"
requires-python = ">=3.11"
# Engine is stdlib; `anthropic` is used only by the WhatsApp summariser (utils/summariser.py).
dependencies = [
    "anthropic>=1.2.0",
]

[project.scripts]
app = "app:main"
dev = "dev:main"
sync = "sync_unleashed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["constants", "utils"]
only-include = ["app.py", "dev.py", "server.py", "sync_unleashed.py", "constants", "utils"]

[tool.uv]
package = true
